schema_version: 0.1
name: my-harness
version: 0.11.0
principle: "Use the smallest process that safely proves the work."
lanes:
  - tiny
  - normal
  - high_risk
  - approval_required
state:
  features: harness/features.json
  progress: harness/progress.md
startup:
  windows: scripts/init.ps1
  posix: scripts/init.sh
cli:
  windows: scripts/harness.ps1
  posix: scripts/harness.sh
  database: harness/harness.db
  runtime_logs: harness/runs/
  runtime_prompts: harness/prompts/
  prompt_templates: templates/prompts/
docs:
  index: docs/INDEX.md
  intake: docs/INTAKE.md
  workflows: docs/WORKFLOWS.md
  verification: docs/VERIFICATION.md
  human_gate: docs/HUMAN_GATE.md
  cli: docs/CLI.md
  runner: docs/RUNNER.md
  adapters: docs/ADAPTERS.md
  checks: docs/CHECKS.md
  contracts: docs/CONTRACTS.md
  release_install: docs/RELEASE_INSTALL.md
  harness_engineering_adoption: docs/HARNESS_ENGINEERING_ADOPTION.md
  decisions: docs/decisions/
  cross_repo_ideas: ANALYSIS_CROSS_REPO_IDEAS.md
package:
  npm_name: "@ntu254/my-harness"
  launcher: bin/my-harness.js
  packaged_workspace_env: MY_HARNESS_WORKSPACE
